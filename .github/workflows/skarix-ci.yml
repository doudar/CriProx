name: Skarix CI
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: skarix-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  studio:
    name: Studio / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify renderer and existing project preservation
        if: runner.os == 'Windows'
        run: npx --no-install electron tests/ai-design-fixes.electron.cjs
      - name: Verify artwork effects, text paths and MCP rendering
        if: runner.os == 'Windows'
        run: npx --no-install electron tests/design-appearance.electron.cjs
      - name: Verify layer groups and reference editing
        if: runner.os != 'Linux'
        run: npx --no-install electron tests/design-workflow.electron.cjs
      - name: Verify actual app shutdown with AI access off and on
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npx --no-install electron tests/app-shutdown.electron.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx --no-install electron tests/app-shutdown.electron.cjs --ai
      - name: Verify desktop packaging
        run: npx --no-install electron-builder --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

  docs:
    name: Website and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --prefix site
      - run: npm test --prefix site
      - name: Check documentation and non-releasing website titles
        if: github.event_name == 'pull_request'
        run: npm run check:docs --prefix site
      - run: npm run build --prefix site -- --offline
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: website-preview
          path: site/_site
          if-no-files-found: error
          retention-days: 7

  workflows:
    name: Validate workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .github/release-tools/package-lock.json
      - run: npm ci --prefix .github/release-tools --ignore-scripts
      - run: npm test --prefix .github/release-tools
      - name: Install verified actionlint and validate workflows
        shell: bash
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
